tnts:
  liquidcleaner:
    name: "<gradient:#1E90FF:#00BFFF>Водяная бомба</gradient>"
    power: 16 #if power = 20, radius ~ 10, f = (power / 2)
    stonedamage: 0 # Used in the API
    setfire: true # Effects on the tnt block
    breakblocks: true # If enabled, breaks blocks
    replaceblocks:
      replace: true # If enabled can change blocks to other blocks
      replaced-blocks: # Type of block to be changed to
        - WATER
        - LAVA
      setblock: AIR # Type of block to be applied
    description:
      - ""
      - " <gradient:#FFFFFF:#FFFFFF>Особенности:</gradient>"
      - " <gradient:#FFFFFF:#FFFFFF>Убирает</gradient> <gradient:#1E90FF:#00BFFF>воду</gradient>"
      - ""
